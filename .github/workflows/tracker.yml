name: ARK tracker

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min; if a run is already going, the next one waits in line
  workflow_dispatch:          # lets you start it by hand from the Actions tab
    inputs:
      run_seconds:
        description: 'How long to run (seconds). Leave blank for the normal ~5.5h.'
        required: false

concurrency:
  group: ark-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SALT_DATA: ${{ secrets.SALT_DATA }}
          RUN_SECONDS: ${{ inputs.run_seconds || '19800' }}
        run: python -u tracker.py

      # Save player counts so the next run picks up where this one left off.
      # The commit also keeps GitHub from pausing the schedule after 60 idle days.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "Update tracker state"
          git pull --rebase && git push
